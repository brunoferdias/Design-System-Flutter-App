# Lint rules for the project. `flutter_lints` is the set that comes with
# Flutter; the extra rules below are the ones this project cares about.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    # Keeps imports written the same way everywhere.
    - always_use_package_imports
    - directives_ordering
    - prefer_single_quotes

    # Constructors first, then fields, then methods.
    - sort_constructors_first

    # Do not start a Future and forget about it by accident.
    - unawaited_futures
