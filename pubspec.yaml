name: design_system_flutter
description: >-
  Aurora DS — an exemplary Flutter application showcasing a token-driven design
  system that renders natively with Material 3 and Cupertino, fully localized
  in English, Portuguese and German.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Cupertino (iOS) icon set — required by the Cupertino design language.
  cupertino_icons: ^1.0.8
  # Declarative, URL-driven navigation.
  go_router: ^17.5.0
  # Compile-safe dependency injection + reactive state management.
  flutter_riverpod: ^3.4.3
  # Message formatting / pluralization used by the generated localizations.
  intl: any
  # Key-value storage backing the settings repository.
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
