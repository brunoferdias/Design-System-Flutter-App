name: design_system_flutter
description: >-
  Aurora DS — an exemplary Flutter application showcasing a token-driven design
  system that renders natively with Material 3 and Cupertino, fully localized
  in English, Portuguese and German.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.3
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
